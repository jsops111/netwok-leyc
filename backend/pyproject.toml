[project]
name = "network-check"
version = "0.1.0"
description = "网络线路检测与展示平台 —— 线路拨测 / 交换机防火墙采集 / 事件追踪 / 告警推送"
requires-python = ">=3.12"

dependencies = [
    # Web
    "django>=6.0.7",
    "djangorestframework>=3.17.1",
    "django-filter>=26.1",
    "django-cors-headers>=4.9.0",
    "python-dotenv>=1.2.2",
    # DB —— 与 ops-ai-cmdb 同一台 PG 17,不同库
    "psycopg[binary]>=3.3.4",
    # 调度:秒级拨测靠 beat 每秒 tick + Redis 到期队列,见 netcheck/scheduler.py
    "celery>=5.6.3",
    "redis>=8.1.0",
    # 设备采集三条通道
    #   SNMP  —— 交换机/防火墙的主通道。pysnmp 7 是 asyncio 版,
    #            v3arch.asyncio 那套 API 才支持 SNMPv3 认证加密
    "pysnmp>=7.1.0",
    #   SSH   —— Cisco IOS-XE / FortiOS 的 CLI 兜底通道
    "paramiko>=5.0.0",
    #   HTTP  —— FortiGate REST API、iDRAC Redfish、Webhook 推送、Telegram sendMessage
    "requests>=2.32",
    #   **直接 import,所以显式声明**,不靠 requests 传递进来:
    #   idrac/redfish.py 要关掉 InsecureRequestWarning(iDRAC 出厂是自签证书,
    #   几十台机器每分钟一条警告会把日志淹掉)。requests 哪天换了 HTTP 后端,
    #   一个没声明的直接 import 会在新环境里报 ModuleNotFoundError
    "urllib3>=2.0",
    # DNS 拨测。**这是有意新增的依赖**:需求要求"配置检测的 IP",也就是
    # 要能指向**指定的那台 DNS 服务器**发查询,而 socket.getaddrinfo 只会走
    # 系统 resolver,拨测目标填了也没用。自己拼 DNS 报文则要处理压缩指针、
    # CNAME 链、TC 截断这些细节,那是 bug 的产地。dnspython 是纯 Python、
    # 无编译依赖。
    "dnspython>=2.7",
    # 凭据字段加密(SNMP community / SSH 口令 / API token / Bot token /
    # 两步验证的 TOTP 密钥)
    "cryptography>=50.0.0",
    # 两步验证。**这两个是有意新增的**:
    #   pyotp  —— TOTP(RFC 6238)。算法本身三十行能写完,但"验证窗口放多宽"、
    #             "时间步要不要记下来防重放"这些决定错了不会报错,只会静悄悄
    #             留个洞。用现成的实现,自己只管窗口策略(见 accounts/totp.py)
    #   qrcode —— 绑定时那张二维码。在后端渲染成 SVG(SvgPathImage 不需要
    #             Pillow),前端就不用为一个一辈子只用一次的功能引 QR 库
    "pyotp>=2.9.0",
    "qrcode>=8.0",
    # 常驻进程与 WSGI
    "supervisor>=4.3.0",
    "gunicorn>=26.0.0",
    "whitenoise>=6.0",
]

[tool.uv]
package = false

# 与 ops-ai-cmdb 同样的坑:backend/ 下平铺多个顶层包,setuptools 自动发现会
# 直接拒绝("Multiple top-level packages discovered in a flat-layout")。
# **新增 Django app 要在下面补一行**,否则新环境上装不进去,
# 而报错是 ModuleNotFoundError,指不到这个文件。
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "accounts*", "netcheck*"]
