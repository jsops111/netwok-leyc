# ---------------------------------------------------------------------------
# 前端 nginx。两件事:发静态文件、把 /api 反代给后端。
# ---------------------------------------------------------------------------
upstream netcheck_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 大屏在浏览器里长期挂着,gzip 省的是每次刷新的流量
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存 —— 缓存了它,前端发版后用户拿到的还是旧的
    # asset 引用,页面直接白屏
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://netcheck_backend;
        proxy_http_version 1.1;
        # **必须是 $http_host,不能是 $host。**$host 会把端口去掉,而这个平台
        # 通常跑在 18120 这类非标准端口上。Django 的 CSRF 校验拿浏览器发来的
        # Origin(带端口,如 http://10.0.0.5:18120)和 request.get_host()
        # (从这个头来)比对 —— 端口被剥掉就永远对不上,所有写操作 403,
        # 提示是"CSRF验证失败",而看起来像是登录或权限出了问题
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # 大屏聚合接口在线路多的时候会慢一点,别在 60 秒就切断
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_buffering       off;
    }

    location /admin/ {
        proxy_pass http://netcheck_backend;
        proxy_set_header Host $http_host;    # 同上,不能是 $host
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://netcheck_backend;
    }

    # SPA 路由:/events、/config 这些路径刷新时要落回 index.html,
    # 否则直接访问二级路由是 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
